# =============================================================================
# CD — Despliegue Continuo
# =============================================================================
# Propósito: Publicar imágenes Docker a GHCR (backup/rollback) y desplegar
# en producción automáticamente cuando se hace push a main.
#
# Estrategia de deploy:
#   El servidor construye las imágenes localmente (git pull + docker compose build).
#   Las imágenes en ghcr.io sirven como respaldo versionado para rollbacks.
#
# Jobs:
#   1. build-and-push — Construye y publica imágenes a ghcr.io (backup)
#   2. deploy         — git pull + rebuild + restart en el servidor via SSH
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   - SSH_HOST          — IP del servidor: 38.107.237.131
#   - SSH_USER          — Usuario SSH: root
#   - SSH_PRIVATE_KEY   — Clave privada SSH (contenido de ~/.ssh/id_ed25519)
#   - SSH_PORT          — Puerto SSH: 22
#   - ENV_FILE          — Contenido completo de /opt/titilatte/infra/.env
# =============================================================================

name: CD

on:
  push:
    branches:
      - main

# Garantiza que solo un deploy corra a la vez en producción.
# Si hay un deploy en curso y llega otro push, el nuevo espera (no cancela).
concurrency:
  group: cd-production
  cancel-in-progress: false

# Permisos mínimos para el GITHUB_TOKEN:
# - contents: read  — para checkout
# - packages: write — para publicar imágenes en ghcr.io
permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Push — Construye imágenes y las publica en ghcr.io
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    # outputs permite que el job "deploy" use el SHA del commit como tag
    outputs:
      image-tag: ${{ github.sha }}

    steps:
      # --- Checkout -----------------------------------------------------------
      - name: Checkout código fuente
        uses: actions/checkout@v4

      # --- Docker Buildx ------------------------------------------------------
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Autenticación en GitHub Container Registry -------------------------
      # GITHUB_TOKEN es automáticamente disponible en cada workflow run.
      # Tiene permisos de escritura en packages gracias a la sección "permissions"
      # de arriba. No requiere secretos adicionales para ghcr.io.
      - name: Login en GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Metadata Backend ---------------------------------------------------
      # docker/metadata-action genera automáticamente los tags de la imagen:
      # - SHA del commit (p.ej. sha-a1b2c3d)
      # - "latest" para pushes a main
      # También extrae labels OCI estándar (autor, URL, descripción).
      - name: Extraer metadata para imagen Backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            # Tag con el SHA completo del commit (inmutable — ideal para rollback)
            type=sha,format=long,prefix=
            # Tag "latest" apuntando siempre al último build de main
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag adicional con el SHA corto para legibilidad
            type=sha,prefix=sha-

      # --- Metadata Frontend --------------------------------------------------
      - name: Extraer metadata para imagen Frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # --- Build & Push Backend -----------------------------------------------
      # Construye la imagen del backend y la publica en ghcr.io con los tags
      # generados por metadata-action. El caché de capas se almacena en el
      # registro GHCR (type=registry) para persistir entre runs.
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          # Caché en el registro (más eficiente que gha para imágenes de producción)
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/backend:buildcache,mode=max
          # Provenance attestation para supply chain security (SLSA)
          provenance: true
          sbom: true

      # --- Build & Push Frontend ----------------------------------------------
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/frontend:buildcache,mode=max
          provenance: true
          sbom: true
          build-args: |
            VITE_API_URL=/api/v1

      # --- Resumen en la UI de GitHub Actions ---------------------------------
      - name: Resumen de imágenes publicadas
        run: |
          echo "### Imágenes publicadas en ghcr.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| backend | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| backend | \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | \`latest\` |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 2: Deploy — Despliega en el servidor de producción via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy a Producción
    runs-on: ubuntu-latest
    needs: build-and-push
    # Protección adicional: este job solo corre en la rama main.
    # Evita deploys accidentales desde ramas de feature si el workflow
    # se modifica por error.
    if: github.ref == 'refs/heads/main'

    # Entorno de GitHub para auditoría y protection rules opcionales.
    # En Settings → Environments → production se pueden configurar:
    # - Reviewers requeridos antes del deploy
    # - Branches permitidas (solo main)
    # - Wait timer (delay entre merge y deploy)
    environment:
      name: production

    steps:
      - name: Deploy en servidor de producción
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 300s
          envs: ENV_FILE,IMAGE_TAG,DEPLOY_ACTOR
          script: |
            set -euo pipefail

            echo "==> Deploy del commit: ${IMAGE_TAG}"
            echo "==> Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "==> Iniciado por: ${DEPLOY_ACTOR}"

            # Directorio de la aplicación
            cd /opt/titilatte

            # Actualizar .env de producción
            printf '%s' "${ENV_FILE}" > infra/.env
            chmod 600 infra/.env

            # Traer el código más reciente
            echo "==> git pull..."
            git pull origin main

            # Rebuild y restart de contenedores
            # Solo rebuildeamos lo que cambió (Docker cache layer)
            echo "==> Rebuilding imágenes..."
            cd infra
            docker compose -f docker-compose.yml -f docker-compose.ssl.yml build

            echo "==> Aplicando cambios..."
            docker compose -f docker-compose.yml -f docker-compose.ssl.yml \
              up -d --remove-orphans

            # Limpiar imágenes sin uso para no llenar el disco
            echo "==> Limpiando imágenes obsoletas..."
            docker image prune -f

            echo "==> Deploy completado"
            docker compose -f docker-compose.yml -f docker-compose.ssl.yml ps

