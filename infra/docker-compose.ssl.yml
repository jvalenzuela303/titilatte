# =============================================================================
# Docker Compose — Override SSL (Cloudflare Origin Certificate)
#
# Uso (desde infra/):
#   docker compose -f docker-compose.yml -f docker-compose.ssl.yml \
#                  --env-file .env up -d
#
# Requisitos previos:
#   - infra/nginx/ssl/titilatte.crt  (Cloudflare Origin Certificate)
#   - infra/nginx/ssl/titilatte.key  (clave privada del certificado)
# =============================================================================

services:
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro,z
      - ./nginx/ssl:/etc/nginx/ssl:ro,z
