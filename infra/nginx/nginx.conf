# =============================================================================
# Nginx — Reverse Proxy Principal
# Minimarket Platform — con SSL (Cloudflare Origin Certificate)
#
# Responsabilidades:
#   - /api/      → upstream backend (Spring Boot :8080)
#   - /          → upstream frontend (React SPA)
#   - Rate limiting en /api/auth/ (protección brute-force login)
#   - HTTPS en puerto 443 con certificado Cloudflare Origin
#   - HTTP en puerto 80 redirige a HTTPS
#   - Gzip, security headers, HSTS
# =============================================================================

# Número de procesos worker. "auto" usa el número de CPU cores disponibles.
worker_processes auto;

# Archivo PID — en la imagen alpine el usuario no-root usa /tmp
pid /tmp/nginx.pid;

# Nivel de logging. En desarrollo se puede subir a "debug".
error_log /var/log/nginx/error.log warn;

events {
    # Máximo de conexiones simultáneas por worker.
    # Para desarrollo 1024 es suficiente.
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ---- Tipos MIME ----
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Formato de logs ----
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ---- Optimizaciones de red ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;   # No revelar versión de nginx en headers

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;       # Balance velocidad / compresión (1–9)
    gzip_min_length 1024;    # No comprimir respuestas pequeñas
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Buffers y timeouts de proxy ----
    proxy_connect_timeout       10s;
    proxy_send_timeout          30s;
    proxy_read_timeout          30s;
    proxy_buffer_size           4k;
    proxy_buffers               8 8k;
    proxy_busy_buffers_size     16k;

    # ---- Rate Limiting ----
    # Zone "auth_limit": limita peticiones al endpoint de autenticación.
    # 10m = 10 MB de memoria para la tabla de estados (almacena ~160.000 IPs).
    # rate=5r/m = máximo 5 requests por minuto por IP.
    # Protege contra ataques de fuerza bruta en login.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Zone "api_limit": límite general para todas las rutas /api/.
    # rate=60r/m = 60 requests por minuto por IP (1 req/seg en promedio).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # ---- Upstreams ----
    # backend: Spring Boot en la red backend-net
    upstream backend {
        server backend:8080;
        keepalive 32;   # Mantiene conexiones keep-alive hacia el backend
    }

    # frontend: React SPA (dev server Vite en dev, nginx en producción)
    # El valor de FRONTEND_UPSTREAM varía entre base y override:
    #   - Base (producción):   frontend:80   (nginx estático dentro del contenedor)
    #   - Override (dev):      frontend:5173 (Vite dev server)
    # La variable se sustituye en tiempo de arranque con envsubst.
    upstream frontend {
        server ${FRONTEND_UPSTREAM};
        keepalive 16;
    }

    # ---- Mapa de headers SSL para el backend ----
    # Cuando llega por HTTPS, informamos al backend que el esquema es https.
    map $https $forwarded_proto {
        on   https;
        default http;
    }

    # =========================================================================
    # Virtual Host HTTP — redirige a HTTPS
    # Cloudflare siempre conecta al origen; este bloque acepta sus health checks
    # y redirige cualquier otra petición directa al puerto 443.
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Health check de nginx (Docker healthcheck sigue usando HTTP)
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Todo lo demás → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Virtual Host HTTPS — tráfico principal con Cloudflare Origin Certificate
    # =========================================================================
    server {
        listen 443 ssl;
        server_name _;

        # ---- Cloudflare Origin Certificate ----
        ssl_certificate     /etc/nginx/ssl/titilatte.crt;
        ssl_certificate_key /etc/nginx/ssl/titilatte.key;

        # ---- Protocolos y cifrados modernos ----
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Tamaño máximo del body
        client_max_body_size 10m;

        # ---- Security Headers ----
        add_header X-Frame-Options                   "DENY"                              always;
        add_header X-Content-Type-Options            "nosniff"                           always;
        add_header X-XSS-Protection                  "1; mode=block"                     always;
        add_header Referrer-Policy                   "strict-origin-when-cross-origin"   always;
        add_header Permissions-Policy                "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security         "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src ${CSP_SCRIPT_SRC}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${CSP_CONNECT_EXTRA}; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
            always;

        # ---- Health check ----
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ---- Autenticación — rate limiting estricto ----
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }

        # ---- SSE — Server-Sent Events ----
        location /api/v1/events/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        '';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
            proxy_hide_header  X-Accel-Buffering;
        }

        # ---- API general ----
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }

        # ---- Actuator health (visible) ----
        location /actuator/health {
            proxy_pass       http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        location /actuator/ {
            return 403;
        }

        # ---- Assets estáticos ----
        location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_pragma;
        }

        # ---- Frontend SPA ----
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        }
    }
}
