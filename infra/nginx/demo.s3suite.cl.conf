# =============================================================================
# demo.s3suite.cl — Nginx reverse proxy para Minimarket Demo
#
# Backend: 127.0.0.1:8081 (minimarket-demo-backend)
# Frontend: 127.0.0.1:3002 (minimarket-demo-frontend)
#
# Instalar en el host VPS:
#   sudo cp demo.s3suite.cl.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Luego obtener SSL:
#   sudo certbot --nginx -d demo.s3suite.cl
# =============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name demo.s3suite.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://demo.s3suite.cl$request_uri;
    }
}

# HTTPS — aplicación Minimarket Demo
server {
    listen 443 ssl http2;
    server_name demo.s3suite.cl;

    # SSL — certbot actualiza estas rutas automáticamente
    ssl_certificate     /etc/letsencrypt/live/demo.s3suite.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.s3suite.cl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_DEMO:10m;
    ssl_session_timeout 1d;

    # ---- Headers de seguridad ----
    add_header X-Frame-Options           "SAMEORIGIN"                            always;
    add_header X-Content-Type-Options    "nosniff"                               always;
    add_header X-XSS-Protection          "1; mode=block"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"   always;

    # Límite de tamaño de petición (subida de archivos)
    client_max_body_size 10m;

    # ---- API Backend (/api/) → minimarket-demo-backend:8081 ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ---- Bloquear swagger en demo ----
    location /swagger-ui/ { return 404; }
    location /api-docs/   { return 404; }

    # ---- Frontend → minimarket-demo-frontend:3002 ----
    # El nginx interno del contenedor maneja SPA (try_files → index.html).
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Caché para assets estáticos ----
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            30d;
        add_header         Cache-Control "public, immutable" always;
        access_log         off;
    }
}
